name: Build Android APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Repository Code
      uses: actions/checkout@v4

    - name: Set up Python Runtime
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Android Compiler Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y git zip unzip openjdk-17-jdk autoconf libtool pkg-config zlib1g-dev libncurses5-dev libssl-dev libffi-dev
        pip install --upgrade pip buildozer cython kivy requests

    - name: Generate Compiler Specifications Config
      run: |
        cat << 'EOF' > buildozer.spec
        [app]
        title = Jarvis AI
        package.name = jarvis
        package.domain = com.sufiyan
        source.dir = .
        source.include_exts = py,png,json
        version = 1.0
        requirements = python3,kivy,requests
        orientation = portrait
        fullscreen = 1
        android.permissions = INTERNET, CALL_PHONE, SYSTEM_ALERT_WINDOW
        android.api = 33
        android.minapi = 21
        android.archs = arm64-v8a
        paddles = False
        [buildozer]
        log_level = 2
        warn_on_root = 0
        EOF

    - name: Run Buildozer Compiler
      run: |
        buildozer android debug

    - name: Upload Completed App File Installer
      uses: actions/upload-artifact@v4
      with:
        name: Jarvis-AI-App-Installer
        path: bin/*.apk
        
