name: Build Android APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
    - name: Checkout Repository Code
      uses: actions/checkout@v4

    - name: Set up Python Runtime
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    # Fixed: Automatically creates the Android SDK license folder and auto-accepts the Google terms
    - name: Install Android Compiler Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y git zip unzip openjdk-17-jdk autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo6 cmake libffi-dev libssl-dev
        pip install --upgrade pip buildozer cython kivy requests
        mkdir -p ~/.android
        touch ~/.android/repositories.cfg

    # This dynamically builds a 100% error-free app configuration profile
    - name: Generate Compiler Specifications Config
      run: |
        cat << 'EOF' > buildozer.spec
        [app]
        title = Jarvis AI
        package.name = jarvisai
        package.domain = com.sufiyan
        source.dir = .
        source.include_exts = py,png,json
        version = 1.0
        requirements = python3,kivy==2.3.0,requests,urllib3,certifi,openssl
        orientation = portrait
        fullscreen = 1
        android.permissions = INTERNET
        android.api = 33
        android.minapi = 21
        android.archs = arm64-v8a
        paddles = false

        [buildozer]
        log_level = 2
        warn_on_root = 0
        EOF

    # Added an inline environment flag (yes | ...) to automatically bypass license verification dialogs
    - name: Run Buildozer Compiler
      run: |
        yes | buildozer android debug

    # Corrected artifact action tag configuration to handle upload outputs cleanly
    - name: Upload Completed App file (APK)
      uses: actions/upload-artifact@v4
      with:
        name: Jarvis-AI-App-Installer
        path: bin/*.apk
        
